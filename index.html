<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Discount Calculator</title>
  <style>
    :root{
      --border:#ddd;
      --muted:#666;
      --error:#b00020;
      --ok:#0b6;
      --warn:#a05a00;
      --bg:#fff;
      --soft:#f7f7f7;
      --soft2:#fcfcfc;
      --highlight:#f3f6ff;
    }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; max-width: 1050px; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    .card { border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 14px; background: var(--bg); }
    label { font-size: 13px; color: #333; display:block; margin-bottom:6px; }
    input, select { width: 100%; padding: 10px; font-size: 15px; border:1px solid var(--border); border-radius: 10px; background:#fff; }
    input:disabled, select:disabled { background: #f2f2f2; color:#777; }
    .grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px 12px; align-items: end; }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px 12px; }
    .span2{ grid-column: span 2; }
    .span4{ grid-column: 1 / -1; }
    .row { display:flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed #eee; }
    .row:last-child { border-bottom: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .err { color: var(--error); font-weight: 600; }
    .warn { color: var(--warn); font-weight: 600; }
    .ok { color: var(--ok); font-weight: 600; }
    .btns { display:flex; flex-wrap:wrap; gap:10px; margin-top: 12px; }
    button { padding: 10px 12px; font-size: 14px; cursor:pointer; border-radius: 10px; border: 1px solid #ccc; background:#fff; }
    button:hover { background:#f6f6f6; }
    button:disabled { cursor:not-allowed; opacity: .55; }
    .toast { margin-top: 10px; font-size: 13px; color: var(--ok); display:none; }
    .messages { margin-top: 10px; display:grid; gap:8px; }
    .msg { border:1px solid var(--border); border-radius: 10px; padding: 10px; background: var(--soft2); font-size: 13px; }
    .msg.warn { border-color: #f2c38b; background:#fff8ef; color: var(--warn); font-weight: 600; }
    .msg.err { border-color: #f0a0a8; background:#fff1f3; color: var(--error); font-weight: 600; }
    .msg.ok { border-color: #9fe0c0; background:#f0fff7; color: var(--ok); font-weight: 600; }

    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 12px; overflow:hidden; border:1px solid var(--border); border-radius: 12px; }
    thead th {
      position: sticky; top: 0; z-index: 2;
      background: var(--soft);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    th, td { text-align: right; padding: 10px 10px; }
    th:first-child, td:first-child { text-align: left; }
    tbody tr:nth-child(odd) td { background: #fff; }
    tbody tr:nth-child(even) td { background: var(--soft2); }

    /* highlight Total Price column */
    th.total, td.total { background: var(--highlight) !important; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Discount Calculator</h1>

  <div class="card">
    <!-- Compact row -->
    <div class="grid">
      <div>
        <label>Product</label>
        <input id="product" type="text" value="Enterprise Remote Support" />
      </div>
      <div>
        <label>Quantity</label>
        <input id="quantity" type="number" step="1" value="10" />
      </div>
      <div>
        <label>Duration (Years)</label>
        <input id="years" type="number" step="1" value="3" />
      </div>
      <div>
        <label>Discount Model</label>
        <select id="model">
          <option value="flat">Flat (same every year)</option>
          <option value="frontloaded" selected>Front-loaded (+Δ / -Δ)</option>
          <option value="custom">Custom (year deltas)</option>
        </select>
      </div>
    </div>

    <div style="height:12px;"></div>

    <div class="grid2">
      <div class="span2">
        <label>List Price per License per Year (€)</label>
        <input id="listPrice" type="text" inputmode="decimal" placeholder="e.g. 1.080,00" value="1.080,00" />
      </div>
      <div class="span2">
        <label>Target TCV Total (After Discount) (€)</label>
        <input id="tcv" type="text" inputmode="decimal" placeholder="e.g. 24.270,00" value="24.270,00" />
      </div>

      <!-- Frontloaded controls -->
      <div id="frontControls" class="span4" style="display:none;">
        <div class="grid2">
          <div>
            <label>Delta (percentage points)</label>
            <input id="deltaPP" type="number" step="0.01" value="5" />
          </div>
          <div class="span2"></div>
          <div></div>
        </div>
        <div class="muted">Front-loaded applies: Year 1 = base + Δ, Last year = base − Δ, middle years = base.</div>
      </div>

      <!-- Custom controls -->
      <div id="customControls" class="span4" style="display:none;">
        <div class="grid2">
          <div>
            <label>Year 1 delta (percentage points)</label>
            <input id="customFirstPP" type="number" step="0.01" value="5" />
          </div>
          <div>
            <label>Last year delta (percentage points)</label>
            <input id="customLastPP" type="number" step="0.01" value="-5" />
          </div>
          <div class="span2"></div>
        </div>
        <div class="muted">Custom applies: Year 1 = base + delta1, Last year = base + deltaLast, middle years = base.</div>
      </div>
    </div>

    <div class="btns">
      <button id="btnCopyLink">Copy link</button>
      <button id="btnCopyTable">Copy table</button>
      <button id="btnExample">Example</button>
      <button id="btnClear">Clear</button>
      <button id="btnCSV">Download Excel (CSV)</button>
      <button id="btnXLSX" title="Creates a real .xlsx (uses an external library).">Download Excel (XLSX)</button>
    </div>

    <div id="toast" class="toast"></div>
    <div id="messages" class="messages"></div>
  </div>

  <div id="out" class="card"></div>

  <!-- Optional for XLSX export (works only if CDN is allowed) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
  // =========================
  // Defaults
  // =========================
  const EXAMPLE = {
    product: 'Enterprise Remote Support',
    listPrice: '1.080,00',
    quantity: '10',
    years: '3',
    tcv: '24.270,00',
    model: 'frontloaded',
    deltaPP: '5',
    customFirstPP: '5',
    customLastPP: '-5'
  };

  // =========================
  // Helpers
  // =========================
  function clamp(x, min, max){ return Math.max(min, Math.min(max, x)); }

  const nfEUR = new Intl.NumberFormat('nl-NL', { style:'currency', currency:'EUR' });
  function euro(n){ return nfEUR.format(n); }
  function euroPlain(n){ return euro(n).replace('\u00A0', ' '); } // ensure normal space

  // 0..1 -> "17,07895%"
  function pct(n){
    const val = n * 100;
    return val.toFixed(5).replace('.', ',') + '%';
  }

  // EU number parsing:
  // "1.660,50" -> 1660.50
  // "3690"     -> 3690
  // "3.690,00" -> 3690
  // "€ 1.660,50" -> 1660.50
  function parseEuroNumber(value){
    if (value === null || value === undefined) return NaN;
    const s = String(value).trim();
    if (!s) return NaN;

    const cleaned = s
      .replace(/\u00A0/g, ' ')
      .replace(/€/g, '')
      .replace(/\s/g, '');

    const normalized = cleaned
      .replace(/\./g, '')
      .replace(',', '.');

    return parseFloat(normalized);
  }

  // format a number to EU string without € symbol: "1.080,00"
  function formatEuroNumberNoSymbol(n){
    // Use currency formatting and strip "€ " prefix
    const s = euroPlain(n); // "€ 1.080,00"
    // Remove leading currency symbol and possible space
    return s.replace(/^€\s?/, '').trim();
  }

  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(()=>{ el.style.display='none'; }, 2200);
  }

  function setDisabled(disabled){
    document.getElementById('btnCSV').disabled = disabled;
    document.getElementById('btnXLSX').disabled = disabled;
    document.getElementById('btnCopyTable').disabled = disabled;
  }

  function setValue(id, val){ document.getElementById(id).value = val; }

  function showMessages(list){
    const wrap = document.getElementById('messages');
    wrap.innerHTML = '';
    for(const m of list){
      const div = document.createElement('div');
      div.className = `msg ${m.type}`;
      div.textContent = m.text;
      wrap.appendChild(div);
    }
  }

  // =========================
  // Discount model UI
  // =========================
 function updateModelUI(){
  const modelEl = document.getElementById('model');
  const model = modelEl ? modelEl.value : 'frontloaded';

  const front = document.getElementById('frontControls');
  const custom = document.getElementById('customControls');

  if(front) front.style.display = (model === 'frontloaded') ? 'block' : 'none';
  if(custom) custom.style.display = (model === 'custom') ? 'block' : 'none';
}

  // =========================
  // Inputs & validation
  // =========================
  function getInputs(){
    const product = document.getElementById('product').value.trim();
    const listPriceRaw = document.getElementById('listPrice').value;
    const tcvRaw = document.getElementById('tcv').value;

    return {
      productRaw: product,
      listPriceRaw,
      tcvRaw,
      product: product || '—',
      quantity: parseInt(document.getElementById('quantity').value, 10),
      years: parseInt(document.getElementById('years').value, 10),
      listPrice: parseEuroNumber(listPriceRaw),
      tcv: parseEuroNumber(tcvRaw),
      model: document.getElementById('model').value,
      deltaPP: parseFloat(document.getElementById('deltaPP').value),
      customFirstPP: parseFloat(document.getElementById('customFirstPP').value),
      customLastPP: parseFloat(document.getElementById('customLastPP').value)
    };
  }

  function isValidNumber(x){ return typeof x === 'number' && isFinite(x); }

  function validate(state){
    const msgs = [];
    const errors = [];

    if(!state.productRaw) errors.push('Product is required.');
    if(!isValidNumber(state.quantity) || state.quantity <= 0) errors.push('Quantity must be > 0.');
    if(!isValidNumber(state.years) || state.years <= 0) errors.push('Duration (Years) must be > 0.');
    if(!isValidNumber(state.listPrice) || state.listPrice <= 0) errors.push('List Price must be a valid amount > 0 (e.g. 1.080,00).');
    if(!isValidNumber(state.tcv) || state.tcv <= 0) errors.push('Target TCV must be a valid amount > 0 (e.g. 24.270,00).');

    if(state.model === 'frontloaded'){
      if(!isValidNumber(state.deltaPP)) errors.push('Delta (pp) must be a number.');
    }
    if(state.model === 'custom'){
      if(!isValidNumber(state.customFirstPP)) errors.push('Year 1 delta (pp) must be a number.');
      if(!isValidNumber(state.customLastPP)) errors.push('Last year delta (pp) must be a number.');
    }

    if(errors.length){
      msgs.push({ type:'err', text: errors[0] });
      return { ok:false, msgs };
    }
    return { ok:true, msgs };
  }

  // =========================
  // Shareable link
  // =========================
  function setUrlParams(state){
    const url = new URL(window.location.href);
    url.searchParams.set('product', state.productRaw);
    url.searchParams.set('quantity', String(state.quantity));
    url.searchParams.set('years', String(state.years));
    url.searchParams.set('listPrice', state.listPriceRaw);
    url.searchParams.set('tcv', state.tcvRaw);
    url.searchParams.set('model', state.model);
    url.searchParams.set('deltaPP', String(document.getElementById('deltaPP').value ?? ''));
    url.searchParams.set('customFirstPP', String(document.getElementById('customFirstPP').value ?? ''));
    url.searchParams.set('customLastPP', String(document.getElementById('customLastPP').value ?? ''));
    window.history.replaceState({}, '', url.toString());
  }

  function clearUrlParams(){
    const url = new URL(window.location.href);
    url.search = '';
    window.history.replaceState({}, '', url.toString());
  }

  function loadFromUrl(){
    const url = new URL(window.location.href);
    const p = url.searchParams;

    if(p.has('product')) setValue('product', p.get('product'));
    if(p.has('quantity')) setValue('quantity', p.get('quantity'));
    if(p.has('years')) setValue('years', p.get('years'));
    if(p.has('listPrice')) setValue('listPrice', p.get('listPrice'));
    if(p.has('tcv')) setValue('tcv', p.get('tcv'));
    if(p.has('model')) setValue('model', p.get('model'));
    if(p.has('deltaPP')) setValue('deltaPP', p.get('deltaPP'));
    if(p.has('customFirstPP')) setValue('customFirstPP', p.get('customFirstPP'));
    if(p.has('customLastPP')) setValue('customLastPP', p.get('customLastPP'));
  }

  // =========================
  // Core calculation
  // =========================
  function buildDiscounts(baseDiscount, years, model, state){
    // baseDiscount is 0..1
    const discounts = new Array(years).fill(baseDiscount);
    let msgs = [];
    let clamped = false;

    if(years <= 1) return { discounts, msgs };

    if(model === 'flat'){
      // all base
      return { discounts, msgs };
    }

    if(model === 'frontloaded'){
      const delta = (isValidNumber(state.deltaPP) ? state.deltaPP : 0) / 100;
      discounts[0] = baseDiscount + delta;
      discounts[years-1] = baseDiscount - delta;
    }

    if(model === 'custom'){
      const d1 = (isValidNumber(state.customFirstPP) ? state.customFirstPP : 0) / 100;
      const dl = (isValidNumber(state.customLastPP) ? state.customLastPP : 0) / 100;
      discounts[0] = baseDiscount + d1;
      discounts[years-1] = baseDiscount + dl;
    }

    // clamp each year and track
    for(let i=0;i<discounts.length;i++){
      const before = discounts[i];
      discounts[i] = clamp(discounts[i], 0, 1);
      if(discounts[i] !== before) clamped = true;
    }
    if(clamped){
      msgs.push({ type:'warn', text:'Some year discounts were clamped to stay between 0% and 100%.' });
    }
    return { discounts, msgs };
  }

  function compute(state){
    const msgs = [];

    const listTotal = state.listPrice * state.quantity * state.years;

    // sanity
    if(state.tcv > listTotal){
      msgs.push({ type:'warn', text:'Target TCV exceeds List Total. Resulting discount would be negative; discounts are clamped to a minimum of 0%.' });
    }

    let baseDiscount = 1 - (state.tcv / listTotal);
    const rawBase = baseDiscount;
    baseDiscount = clamp(baseDiscount, 0, 1);
    if(baseDiscount !== rawBase){
      msgs.push({ type:'warn', text:'Base discount was clamped to stay between 0% and 100%.' });
    }

    if(baseDiscount > 0.95){
      msgs.push({ type:'warn', text:'Base discount is unusually high (>95%). Double-check inputs.' });
    }

    const { discounts, msgs: dmsgs } = buildDiscounts(baseDiscount, state.years, state.model, state);
    msgs.push(...dmsgs);

    const rows = [];
    let sumNet = 0;

    for(let y=1; y<=state.years; y++){
      const d = discounts[y-1];
      const discountedPerLicense = state.listPrice * (1 - d);
      const totalPrice = discountedPerLicense * state.quantity;
      sumNet += totalPrice;

      rows.push({
        Product: state.product,
        Quantity: state.quantity,
        "Duration (Years)": state.years,
        Year: y,
        "List Price per License (€)": state.listPrice,
        "Discount (%)": d,
        "Discounted Price per License (€)": discountedPerLicense,
        "Total Price (€)": totalPrice
      });
    }

    // check drift (mostly rounding display)
    const diff = Math.abs(sumNet - state.tcv);
    if(diff > 0.01){
      msgs.push({ type:'warn', text:`Sum of yearly lines differs from Target TCV by ${euroPlain(diff)}. (This can happen with clamping or extreme inputs.)` });
    } else {
      msgs.push({ type:'ok', text:'Check passed: Sum of yearly lines matches Target TCV (within rounding).' });
    }

    return { rows, listTotal, baseDiscount, sumNet, msgs };
  }

  // =========================
  // Rendering
  // =========================
  function render(){
    updateModelUI();

    const state = getInputs();
    setUrlParams(state);

    const out = document.getElementById('out');
    const v = validate(state);

    if(!v.ok){
      setDisabled(true);
      showMessages(v.msgs.length ? v.msgs : [{type:'muted', text:'Enter values to calculate.'}]);
      out.innerHTML = `<div class="muted">Enter all required values to see results.</div>`;
      return;
    }

    const result = compute(state);
    showMessages(result.msgs);
    setDisabled(false);

    out.innerHTML = `
      <div class="row"><div>List Total</div><div><b>${euroPlain(result.listTotal)}</b></div></div>
      <div class="row"><div>Target TCV (After Discount)</div><div><b>${euroPlain(state.tcv)}</b></div></div>
      <div class="row"><div>Base Discount</div><div><b>${pct(result.baseDiscount)}</b></div></div>
      <div class="row"><div>Sum of Year Lines</div><div><b>${euroPlain(result.sumNet)}</b></div></div>

      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Duration (Years)</th>
            <th>Year</th>
            <th>List Price per License (€)</th>
            <th>Discount (%)</th>
            <th>Discounted Price per License (€)</th>
            <th class="total">Total Price (€)</th>
          </tr>
        </thead>
        <tbody>
          ${result.rows.map(r => `
            <tr>
              <td>${r["Product"]}</td>
              <td>${r["Quantity"]}</td>
              <td>${r["Duration (Years)"]}</td>
              <td>${r["Year"]}</td>
              <td>${euroPlain(r["List Price per License (€)"])}</td>
              <td>${pct(r["Discount (%)"])}</td>
              <td>${euroPlain(r["Discounted Price per License (€)"])}</td>
              <td class="total">${euroPlain(r["Total Price (€)"])}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  // =========================
  // Exports
  // =========================
  function downloadBlob(filename, mime, content){
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function exportCSV(){
    const state = getInputs();
    const v = validate(state);
    if(!v.ok){ toast('Please fill all required fields first.'); return; }

    const result = compute(state);
    const rows = result.rows;

    const headers = [
      "Product","Quantity","Duration (Years)","Year",
      "List Price per License (€)","Discount (%)",
      "Discounted Price per License (€)","Total Price (€)"
    ];

    const sep = ';'; // best for NL Excel
    const lines = [];
    lines.push(headers.join(sep));

    for(const r of rows){
      const line = [
        r["Product"],
        r["Quantity"],
        r["Duration (Years)"],
        r["Year"],
        euroPlain(r["List Price per License (€)"]),
        pct(r["Discount (%)"]),
        euroPlain(r["Discounted Price per License (€)"]),
        euroPlain(r["Total Price (€)"])
      ].map(v => {
        const s = String(v);
        if(s.includes('"') || s.includes('\n') || s.includes(sep)) return `"${s.replaceAll('"','""')}"`;
        return s;
      }).join(sep);
      lines.push(line);
    }

    const csv = "\uFEFF" + lines.join("\n"); // BOM for Excel
    downloadBlob("discount-calculator.csv", "text/csv;charset=utf-8", csv);
  }

  function exportXLSX(){
    if(typeof XLSX === 'undefined'){
      toast('XLSX library not loaded (CDN blocked). Use CSV export.');
      return;
    }
    const state = getInputs();
    const v = validate(state);
    if(!v.ok){ toast('Please fill all required fields first.'); return; }

    const result = compute(state);
    const rows = result.rows.map(r => ({
      "Product": r["Product"],
      "Quantity": r["Quantity"],
      "Duration (Years)": r["Duration (Years)"],
      "Year": r["Year"],
      "List Price per License (€)": euroPlain(r["List Price per License (€)"]),
      "Discount (%)": pct(r["Discount (%)"]),
      "Discounted Price per License (€)": euroPlain(r["Discounted Price per License (€)"]),
      "Total Price (€)": euroPlain(r["Total Price (€)"]),
    }));

    const ws = XLSX.utils.json_to_sheet(rows, { header: Object.keys(rows[0]) });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Pricing");
    XLSX.writeFile(wb, "discount-calculator.xlsx");
  }

  // =========================
  // Copy table (TSV)
  // =========================
  async function copyTableTSV(){
    const state = getInputs();
    const v = validate(state);
    if(!v.ok){ toast('Please fill all required fields first.'); return; }

    const result = compute(state);
    const rows = result.rows;

    const headers = [
      "Product","Quantity","Duration (Years)","Year",
      "List Price per License (€)","Discount (%)",
      "Discounted Price per License (€)","Total Price (€)"
    ];

    const lines = [];
    lines.push(headers.join('\t'));

    for(const r of rows){
      lines.push([
        r["Product"],
        r["Quantity"],
        r["Duration (Years)"],
        r["Year"],
        euroPlain(r["List Price per License (€)"]),
        pct(r["Discount (%)"]),
        euroPlain(r["Discounted Price per License (€)"]),
        euroPlain(r["Total Price (€)"])
      ].join('\t'));
    }

    try{
      await navigator.clipboard.writeText(lines.join('\n'));
      toast('Table copied (paste into Excel / Google Sheets).');
    } catch(e){
      toast('Copy failed (permissions). Use CSV download instead.');
    }
  }

  // =========================
  // EU input formatting on blur
  // =========================
  function formatMoneyInputOnBlur(id){
    const el = document.getElementById(id);
    const raw = el.value;
    if(!raw.trim()) return;

    const n = parseEuroNumber(raw);
    if(!isFinite(n)) return;

    el.value = formatEuroNumberNoSymbol(n);
  }

  // =========================
  // Buttons
  // =========================
  document.getElementById('btnCopyLink').addEventListener('click', async () => {
    try{
      // Ensure params are up-to-date
      setUrlParams(getInputs());
      await navigator.clipboard.writeText(window.location.href);
      toast('Link copied.');
    } catch(e){
      toast('Copy failed. Please copy the URL manually.');
    }
  });

  document.getElementById('btnCopyTable').addEventListener('click', copyTableTSV);

  document.getElementById('btnExample').addEventListener('click', () => {
    setValue('product', EXAMPLE.product);
    setValue('listPrice', EXAMPLE.listPrice);
    setValue('quantity', EXAMPLE.quantity);
    setValue('years', EXAMPLE.years);
    setValue('tcv', EXAMPLE.tcv);
    setValue('model', EXAMPLE.model);
    setValue('deltaPP', EXAMPLE.deltaPP);
    setValue('customFirstPP', EXAMPLE.customFirstPP);
    setValue('customLastPP', EXAMPLE.customLastPP);
    updateModelUI();
    render();
    toast('Example loaded.');
  });

  document.getElementById('btnClear').addEventListener('click', () => {
    setValue('product', '');
    setValue('listPrice', '');
    setValue('quantity', '');
    setValue('years', '');
    setValue('tcv', '');
    // keep model selection as-is
    clearUrlParams();
    updateModelUI();
    render();
    toast('Cleared.');
  });

  document.getElementById('btnCSV').addEventListener('click', exportCSV);
  document.getElementById('btnXLSX').addEventListener('click', exportXLSX);

  // Live updates
  ['product','quantity','years','listPrice','tcv','model','deltaPP','customFirstPP','customLastPP'].forEach(id => {
    document.getElementById(id).addEventListener('input', render);
  });
  document.getElementById('model').addEventListener('change', () => { updateModelUI(); render(); });

  // Format money inputs when leaving the field
  document.getElementById('listPrice').addEventListener('blur', () => { formatMoneyInputOnBlur('listPrice'); render(); });
  document.getElementById('tcv').addEventListener('blur', () => { formatMoneyInputOnBlur('tcv'); render(); });

  // init
  loadFromUrl();
  updateModelUI();
  render();
</script>
</body>
</html>
