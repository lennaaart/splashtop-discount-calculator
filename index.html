<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Korting calculator</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; max-width: 980px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    label { font-size: 14px; color: #333; display:block; margin-bottom:6px; }
    input { width: 100%; padding: 10px; font-size: 16px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-top: 16px; }
    .muted { color:#666; font-size: 13px; }
    .err { color:#b00020; font-weight: 600; }
    .btns { display:flex; flex-wrap:wrap; gap:10px; margin-top: 12px; }
    button { padding: 10px 12px; font-size: 14px; cursor:pointer; border-radius: 10px; border: 1px solid #ccc; background:#fff; }
    button:hover { background:#f6f6f6; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: right; padding: 8px; border-bottom: 1px solid #eee; }
    th:first-child, td:first-child { text-align: left; }
    th:nth-child(2), td:nth-child(2),
    th:nth-child(3), td:nth-child(3),
    th:nth-child(4), td:nth-child(4) { text-align: right; }
    .row { display:flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed #eee; }
    .row:last-child { border-bottom: 0; }
    .toast { margin-top: 10px; font-size: 13px; color:#0b6; }
  </style>
</head>
<body>
  <h1>Korting calculator</h1>
  <p class="muted">
    Input: Product, List prijs, Quantity (licenties), Duration (Years), gewenste TCV totaal.
    Rekent base korting = 1 - (TCV / list totaal) en verdeelt: jaar 1 = base + 5pp, laatste jaar = base - 5pp.
  </p>

  <div class="card">
    <div class="grid">
      <div>
        <label>Product</label>
        <input id="product" type="text" value="SOS 300" />
      </div>
      <div>
        <label>List prijs per licentie per jaar (€)</label>
        <input id="listPrice" type="number" step="0.01" value="445" />
      </div>

      <div>
        <label>Quantity (aantal licenties)</label>
        <input id="quantity" type="number" step="1" value="10" />
      </div>
      <div>
        <label>Duration (Years)</label>
        <input id="years" type="number" step="1" value="1" />
      </div>

      <div style="grid-column:1 / -1;">
        <label>Gewenste TCV totaal (na korting) (€)</label>
        <input id="tcv" type="number" step="0.01" value="3690" />
        <div class="muted">TCV is het totaalbedrag over alle jaren samen (na korting).</div>
      </div>
    </div>

    <div class="btns">
      <button id="btnCopy">Copy link</button>
      <button id="btnReset">Reset</button>
      <button id="btnCSV">Download Excel (CSV)</button>
      <button id="btnXLSX" title="Maakt een echte .xlsx (gebruikt externe library).">Download Excel (XLSX)</button>
    </div>

    <div id="toast" class="toast" style="display:none;"></div>
  </div>

  <div id="out" class="card"></div>

  <!-- Optioneel voor XLSX export (werkt alleen als internet/CDN toegestaan is) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
  // ---------- helpers ----------
  function clamp(x, min, max){ return Math.max(min, Math.min(max, x)); }

  const nfEUR = new Intl.NumberFormat('nl-NL', { style:'currency', currency:'EUR' });
  function euro(n){ return nfEUR.format(n); }

  function pct(n){
    // n is 0..1, output zoals 17,079%
    const val = n * 100;
    return val.toFixed(3).replace('.', ',') + '%';
  }

  function euroPlain(n){
    // string zoals "€ 3.690,00" (met spatie na €)
    const s = euro(n); // "€ 3.690,00" (met NBSP)
    return s.replace('\u00A0', ' ');
  }

  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(()=>{ el.style.display='none'; }, 2400);
  }

  function getInputs(){
    return {
      product: document.getElementById('product').value.trim() || '—',
      listPrice: parseFloat(document.getElementById('listPrice').value),
      quantity: parseInt(document.getElementById('quantity').value, 10),
      years: parseInt(document.getElementById('years').value, 10),
      tcv: parseFloat(document.getElementById('tcv').value),
    };
  }

  function isValidNumber(x){ return typeof x === 'number' && isFinite(x); }

  // ---------- URL params (shareable link) ----------
  function setUrlParams(state){
    const url = new URL(window.location.href);
    url.searchParams.set('product', state.product);
    url.searchParams.set('listPrice', String(state.listPrice));
    url.searchParams.set('quantity', String(state.quantity));
    url.searchParams.set('years', String(state.years));
    url.searchParams.set('tcv', String(state.tcv));
    window.history.replaceState({}, '', url.toString());
  }

  function clearUrlParams(){
    const url = new URL(window.location.href);
    url.search = '';
    window.history.replaceState({}, '', url.toString());
  }

  function loadFromUrl(){
    const url = new URL(window.location.href);
    const p = url.searchParams;

    if(p.has('product')) document.getElementById('product').value = p.get('product');
    if(p.has('listPrice')) document.getElementById('listPrice').value = p.get('listPrice');
    if(p.has('quantity')) document.getElementById('quantity').value = p.get('quantity');
    if(p.has('years')) document.getElementById('years').value = p.get('years');
    if(p.has('tcv')) document.getElementById('tcv').value = p.get('tcv');
  }

  // ---------- core calculation ----------
  function buildRows(state){
    const { product, listPrice, quantity, years, tcv } = state;

    if(!isValidNumber(listPrice) || listPrice <= 0) return { error: 'List prijs moet > 0 zijn.' };
    if(!isValidNumber(quantity) || quantity <= 0) return { error: 'Quantity moet > 0 zijn.' };
    if(!isValidNumber(years) || years <= 0) return { error: 'Duration (Years) moet > 0 zijn.' };
    if(!isValidNumber(tcv) || tcv <= 0) return { error: 'TCV moet > 0 zijn.' };

    const listTotal = listPrice * quantity * years;
    const ratio = tcv / listTotal;
    let baseDiscount = 1 - ratio;              // jaar 2 korting
    baseDiscount = clamp(baseDiscount, 0, 1);

    const discounts = [];
    for(let y=1; y<=years; y++){
      let d = baseDiscount;

      if(years === 1){
        d = baseDiscount;
      } else if(years === 2){
        d = (y === 1) ? baseDiscount + 0.05 : baseDiscount - 0.05;
      } else {
        if(y === 1) d = baseDiscount + 0.05;
        else if(y === years) d = baseDiscount - 0.05;
        // tussenjaren: base
      }
      discounts.push(clamp(d, 0, 1));
    }

    const rows = [];
    let sumNet = 0;

    for(let y=1; y<=years; y++){
      const d = discounts[y-1];
      const discountedPerLicense = listPrice * (1 - d);
      const totalPrice = discountedPerLicense * quantity;
      sumNet += totalPrice;

      rows.push({
        Product: product,
        Quantity: quantity,
        "Duration (Years)": years,
        Year: y,
        "List Price per License (€)": listPrice,
        "Discount (%)": d,
        "Discounted Price per License (€)": discountedPerLicense,
        "Total Price (€)": totalPrice
      });
    }

    return { rows, baseDiscount, listTotal, sumNet };
  }

  function render(){
    const state = getInputs();
    const out = document.getElementById('out');

    // Update URL live, zodat de link altijd “klopt”
    // (als je dit niet wil: comment deze regel uit)
    setUrlParams(state);

    const result = buildRows(state);
    if(result.error){
      out.innerHTML = `<div class="err">${result.error}</div>`;
      return;
    }

    const { rows, baseDiscount, listTotal, sumNet } = result;

    out.innerHTML = `
      <div class="row"><div>List totaal</div><div><b>${euroPlain(listTotal)}</b></div></div>
      <div class="row"><div>TCV totaal (na korting)</div><div><b>${euroPlain(state.tcv)}</b></div></div>
      <div class="row"><div>Base korting (jaar 2)</div><div><b>${pct(baseDiscount)}</b></div></div>
      <div class="row"><div>Check: som van jaarregels</div><div><b>${euroPlain(sumNet)}</b></div></div>

      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Duration (Years)</th>
            <th>Year</th>
            <th>List Price per License (€)</th>
            <th>Discount (%)</th>
            <th>Discounted Price per License (€)</th>
            <th>Total Price (€)</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>${r["Product"]}</td>
              <td>${r["Quantity"]}</td>
              <td>${r["Duration (Years)"]}</td>
              <td>${r["Year"]}</td>
              <td>${euroPlain(r["List Price per License (€)"])}</td>
              <td>${pct(r["Discount (%)"])}</td>
              <td>${euroPlain(r["Discounted Price per License (€)"])}</td>
              <td><b>${euroPlain(r["Total Price (€)"])}</b></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <p class="muted">
        Verdeling: jaar 1 = base + 5 procentpunt, laatste jaar = base - 5 procentpunt, overige jaren = base.
        (Bij 2 jaar: jaar 1 +5pp en jaar 2 -5pp.)
      </p>
    `;
  }

  // ---------- exports ----------
  function downloadBlob(filename, mime, content){
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function exportCSV(){
    const state = getInputs();
    const result = buildRows(state);
    if(result.error){ toast(result.error); return; }

    const rows = result.rows;

    // Exact kolommen zoals jij wil
    const headers = [
      "Product","Quantity","Duration (Years)","Year",
      "List Price per License (€)","Discount (%)",
      "Discounted Price per License (€)","Total Price (€)"
    ];

    // NL Excel: semicolon delimiter is vaak het veiligst
    const sep = ';';

    const lines = [];
    lines.push(headers.join(sep));

    for(const r of rows){
      const line = [
        r["Product"],
        r["Quantity"],
        r["Duration (Years)"],
        r["Year"],
        euroPlain(r["List Price per License (€)"]),
        pct(r["Discount (%)"]),
        euroPlain(r["Discounted Price per License (€)"]),
        euroPlain(r["Total Price (€)"])
      ].map(v => {
        const s = String(v);
        // CSV escaping
        if(s.includes('"') || s.includes('\n') || s.includes(sep)) return `"${s.replaceAll('"','""')}"`;
        return s;
      }).join(sep);
      lines.push(line);
    }

    // BOM helpt Excel met UTF-8 (€ teken)
    const csv = "\uFEFF" + lines.join("\n");
    downloadBlob("korting-calculator.csv", "text/csv;charset=utf-8", csv);
  }

  function exportXLSX(){
    if(typeof XLSX === 'undefined'){
      toast('XLSX library niet geladen (CDN geblokkeerd). Gebruik CSV export.');
      return;
    }
    const state = getInputs();
    const result = buildRows(state);
    if(result.error){ toast(result.error); return; }

    const rows = result.rows.map(r => ({
      "Product": r["Product"],
      "Quantity": r["Quantity"],
      "Duration (Years)": r["Duration (Years)"],
      "Year": r["Year"],
      "List Price per License (€)": euroPlain(r["List Price per License (€)"]),
      "Discount (%)": pct(r["Discount (%)"]),
      "Discounted Price per License (€)": euroPlain(r["Discounted Price per License (€)"]),
      "Total Price (€)": euroPlain(r["Total Price (€)"]),
    }));

    const ws = XLSX.utils.json_to_sheet(rows, { header: Object.keys(rows[0]) });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Pricing");

    XLSX.writeFile(wb, "korting-calculator.xlsx");
  }

  // ---------- buttons ----------
  document.getElementById('btnCopy').addEventListener('click', async () => {
    try{
      // zorg dat URL up-to-date is
      setUrlParams(getInputs());
      await navigator.clipboard.writeText(window.location.href);
      toast('Link gekopieerd naar clipboard.');
    } catch(e){
      toast('Kon niet kopiëren (browser/permissions). Kopieer de URL handmatig.');
    }
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    document.getElementById('product').value = 'SOS 300';
    document.getElementById('listPrice').value = '445';
    document.getElementById('quantity').value = '10';
    document.getElementById('years').value = '1';
    document.getElementById('tcv').value = '3690';
    clearUrlParams();
    render();
    toast('Gerest.');
  });

  document.getElementById('btnCSV').addEventListener('click', exportCSV);
  document.getElementById('btnXLSX').addEventListener('click', exportXLSX);

  ['product','listPrice','quantity','years','tcv'].forEach(id => {
    document.getElementById(id).addEventListener('input', render);
  });

  // init
  loadFromUrl();
  render();
</script>
</body>
</html>
